<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SEVIN</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%231f3a28%22/><path d=%22M8 2 L13 13 H3 Z%22 fill=%22%23c9d6a0%22/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud" hidden>
    <div id="clock"></div>
    <div id="compass"></div>
    <div id="carry"></div>
    <div id="tut" hidden></div>
    <div id="cross"></div>
    <div id="prompt"></div>
    <div id="sleepHint" hidden></div>
    <div id="work" hidden></div>
    <div id="log"></div>
    <div id="touchbar" hidden>
      <button data-verb="act">Use</button>
      <button data-verb="ask">Ask</button>
      <button data-verb="call">Whistle</button>
      <button data-verb="camp">Camp</button>
      <button data-verb="sleep">Sleep</button>
      <button data-verb="pause">☰</button>
    </div>
  </div>
  <div id="fade" hidden><div id="fadeDay"></div><div id="fadeClock"></div><div id="fadeNote"></div></div>
  <div id="splash" hidden>
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19 22h26L19 42h26" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M32 12v40" stroke="currentColor" stroke-width="1.2" opacity=".5"/></svg>
    <div class="studio" id="splashStudio"></div>
    <div class="presents">presents</div>
    <div class="game" id="splashGame"></div>
    <div class="prompt" id="splashPrompt"></div>
  </div>
  <div id="modal" hidden></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
