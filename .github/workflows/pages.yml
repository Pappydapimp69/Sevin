name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cache-bust every module import with this commit, and stamp the build
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(from \"\.\.?/[^\"]+\.js)\"#\1?v=$V\"#g" src/*.js
          sed -i -E "s#(import\(\"\.\.?/[^\"]+\.js)\"#\1?v=$V\"#g" src/*.js
          sed -i -E "s#src=\"src/main\.js\"#src=\"src/main.js?v=$V\"#; s#>build dev<#>build $V<#" index.html
          grep -c "?v=$V" src/main.js index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: d
        uses: actions/deploy-pages@v4
